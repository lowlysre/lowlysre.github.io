<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lowlysre</title>
<meta name="description" content="Humanism through technology. Open source projects from the lowlysre org.">
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #fdf6e3; --fg: #24292f; --muted: #57606a; --card: #ffffff; --border: #d0d7de; --accent: #2da44e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8b949e; --card: #161b22; --border: #30363d; --accent: #3fb950; }
  }
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, Consolas, monospace; background: var(--bg); color: var(--fg); margin: 0; padding: 48px 24px; max-width: 1024px; margin-inline: auto; }
  header { text-align: center; margin-bottom: 56px; }
  header img { width: 140px; height: 140px; border-radius: 24px; }
  h1 { font-size: 32px; margin: 20px 0 6px; letter-spacing: 1px; }
  .tagline { color: var(--muted); margin: 0; font-size: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .section { margin-bottom: 44px; }
  .section h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin: 0 0 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, transform .15s; text-decoration: none; color: inherit; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card .hero { width: 100%; aspect-ratio: 1200 / 630; object-fit: cover; display: block; }
  .card .hero-fallback { width: 100%; aspect-ratio: 1200 / 630; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--bg); color: var(--muted); font-size: 14px; }
  .card .hero-fallback img { width: 64px; height: 64px; border-radius: 14px; opacity: .7; }
  .card .card-foot { padding: 10px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px 12px; }
  .card .card-foot .links { display: flex; flex-wrap: wrap; gap: 10px; margin-left: auto; }
  .card .card-foot a { color: var(--accent); text-decoration: none; }
  .card .card-foot a:hover { text-decoration: underline; }
  .card .card-foot.placeholder { justify-content: center; opacity: 0.5; font-style: italic; }
  .lang-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: -1px; }
  .card .topics { padding: 0 16px 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .card .topic { font-size: 11px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; }
  #status { text-align: center; color: var(--muted); padding: 32px; }
  footer { margin-top: 64px; text-align: center; color: var(--muted); font-size: 13px; line-height: 2; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <picture>
    <source srcset="/assets/svg/icon-dark.svg" media="(prefers-color-scheme: dark)">
    <img src="/assets/svg/icon-light.svg" alt="lowlysre inchworm">
  </picture>
  <h1>lowlysre</h1>
  <p class="tagline">Humanism through technology. ☮️</p>
  <p class="tagline" style="margin-top:6px;">Systems that don't implode - humility, clarity, and evidence. One inch at a time. 🐛</p>
</header>

<div id="status">loading projects…</div>
<div id="projects"></div>

<footer>
  <a href="https://github.com/lowlysre">github.com/lowlysre</a> ·
  <a href="https://lowlysre.substack.com/">substack</a> ·
  <a href="/brand/">brand assets</a> ·
  <a href="https://github.com/lowlydba">@lowlydba</a>
</footer>

<script>
const HIDDEN = new Set(['.github', 'lowlysre.github.io']);
const langColors = { JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572A5', Go: '#00ADD8', Rust: '#dea584', Shell: '#89e051', HTML: '#e34c26', Jsonnet: '#0064bd', Dockerfile: '#384d54' };

// GitHub Actions expose a marketplace listing; the manifest is read from raw.githubusercontent.com
// (CORS-enabled, not counted against api.github.com's rate limit) instead of the contents API.
async function getActionMarketplaceLink(r) {
  for (const file of ['action.yml', 'action.yaml']) {
    try {
      const res = await fetch(`https://raw.githubusercontent.com/${r.full_name}/${r.default_branch}/${file}`);
      if (!res.ok) continue;
      const yaml = await res.text();
      const name = (yaml.match(/^name:\s*['"]?([^'"\n]+)['"]?/m) || [, r.name])[1];
      const slug = name.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      return `https://github.com/marketplace/actions/${slug}`;
    } catch { /* try next filename */ }
  }
  return null;
}

// No batch endpoint exists for "latest release across an org", so this is one api.github.com call per repo.
async function getLatestRelease(r) {
  try {
    const res = await fetch(`https://api.github.com/repos/${r.full_name}/releases/latest`);
    if (res.ok) { const rel = await res.json(); return { tag: rel.tag_name, url: rel.html_url }; }
  } catch { /* no releases */ }
  return null;
}

// opengraph.githubassets.com renders on demand and drops requests under burst load, so retry with backoff.
function retryHero(img) {
  const n = +(img.dataset.tries || 0) + 1;
  img.dataset.tries = n;
  if (n > 4) {
    const fb = document.createElement('div');
    fb.className = 'hero-fallback';
    fb.innerHTML = '<img src="/assets/svg/icon-light.svg" alt=""><span></span>';
    fb.querySelector('span').textContent = img.alt;
    img.replaceWith(fb);
    return;
  }
  setTimeout(() => { img.src = `${img.dataset.src}?r=${n}`; }, n * 1500 + Math.random() * 1000);
}

fetch('https://api.github.com/orgs/lowlysre/repos?per_page=100&sort=updated')
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(async repos => {
    const shown = repos.filter(r => !HIDDEN.has(r.name) && !r.archived && !r.fork);
    shown.sort((a, b) => b.stargazers_count - a.stargazers_count || a.name.localeCompare(b.name));
    const [marketplaceLinks, releases] = await Promise.all([
      Promise.all(shown.map(getActionMarketplaceLink)),
      Promise.all(shown.map(getLatestRelease)),
    ]);
    document.getElementById('status').style.display = 'none';

    function renderCard(r, i) {
      const links = [
        marketplaceLinks[i] ? `<a href="${marketplaceLinks[i]}" onclick="event.stopPropagation()">🧩 Marketplace</a>` : '',
        releases[i] ? `<a href="${releases[i].url}" onclick="event.stopPropagation()">🏷️ ${releases[i].tag}</a>` : '',
      ].filter(Boolean).join('');
      const topics = r.topics && r.topics.length
        ? `<div class="topics">${r.topics.slice(0, 4).map(t => `<span class="topic">${t}</span>`).join('')}</div>` : '';
      const isEmpty = !r.language && !links && !topics;
      const foot = isEmpty
        ? `<div class="card-foot placeholder">🐛 still inching along</div>`
        : `<div class="card-foot">
            ${r.language ? `<span class="lang"><i class="lang-dot" style="background:${langColors[r.language] || 'var(--accent)'}"></i>${r.language}</span>` : '<span></span>'}
            ${links ? `<span class="links">${links}</span>` : ''}
          </div>${topics}`;
      return `
      <div class="card" onclick="location.href='${r.html_url}'" style="cursor:pointer;">
        <img class="hero" src="https://opengraph.githubassets.com/1/${r.full_name}" alt="${r.name}" loading="lazy" data-src="https://opengraph.githubassets.com/1/${r.full_name}" onerror="retryHero(this)">
        ${foot}
      </div>`;
    }

    // Group into GitHub Actions / repos with releases / everything else, in that priority order.
    const groups = [
      { title: '🧩 GitHub Actions', items: [] },
      { title: '🚀 Shipped', items: [] },
      { title: '🐛 Other Projects', items: [] },
    ];
    shown.forEach((r, i) => {
      if (marketplaceLinks[i]) groups[0].items.push(i);
      else if (releases[i]) groups[1].items.push(i);
      else groups[2].items.push(i);
    });

    document.getElementById('projects').innerHTML = groups
      .filter(g => g.items.length)
      .map(g => `
        <section class="section">
          <h2>${g.title}</h2>
          <div class="grid">${g.items.map(i => renderCard(shown[i], i)).join('')}</div>
        </section>`)
      .join('');
  })
  .catch(() => {
    document.getElementById('status').innerHTML =
      'Couldn\'t load projects - browse them on <a href="https://github.com/lowlysre" style="color:var(--accent)">GitHub</a>.';
  });
</script>
</body>
</html>
